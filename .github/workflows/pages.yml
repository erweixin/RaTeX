name: Deploy to GitHub Pages

on:
  push:
    branches: [main, feat-website]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --target wasm32-unknown-unknown
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wasm-pack
        run: bash scripts/install-wasm-pack.sh

      - name: Build WASM
        run: bash platforms/web/build.sh

      - name: Prepare site
        run: |
          node tools/generate_website_formulas.mjs
          npm --prefix website ci
          npm --prefix website run build
          mkdir -p _site/platforms/web
          cp -r website/dist/* _site/
          cp -r demo _site/
          cp platforms/web/fonts.css _site/platforms/web/
          cp -r platforms/web/fonts _site/platforms/web/
          cp -r platforms/web/pkg _site/platforms/web/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
