name: macOS Rust fallback tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fallback-tests:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Test system-font and renderer fallback paths
        run: |
          cargo test -p ratex-unicode-font
          cargo test -p ratex-font-loader
          cargo test -p ratex-render
          cargo test -p ratex-pdf
          cargo test -p ratex-svg --features standalone
