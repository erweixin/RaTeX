name: PR 152 compatibility patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat-improve' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-improve
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Apply compatibility patch
        run: |
          python3 .github/scripts/fix_pr152.py
          cargo fmt --all
      - name: Verify focused Rust checks
        run: |
          cargo clippy -p ratex-render -p ratex-font-loader -p ratex-pdf -- -D warnings
          cargo test -p ratex-font-loader --all-features
      - name: Commit compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr152-compat-fix.yml
          git rm .github/workflows/pr152-compat-fix-pr.yml
          git rm .github/scripts/fix_pr152.py
          git add crates/ratex-font-loader/src/lib.rs \
                  crates/ratex-render/src/renderer.rs \
                  crates/ratex-pdf/src/renderer.rs \
                  crates/ratex-cairo/src/lib.rs
          git commit -m "fix: preserve font loader compatibility"
          git push origin HEAD:feat-improve
