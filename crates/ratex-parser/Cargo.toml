[package]
name = "ratex-parser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "LaTeX parser for RaTeX"

[[bin]]
name = "parse"
path = "src/bin/parse.rs"

[dependencies]
ratex-types = { workspace = true }
ratex-font  = { workspace = true }
ratex-lexer = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex-lite = "0.1"
unicode-normalization = "0.1.25"
# mhchem (`\ce`, `\pu`) only.
thiserror = { workspace = true, optional = true }
fancy-regex = { version = "0.14", optional = true }
regex = { version = "1.11", optional = true }

[features]
default = ["mhchem"]
# `\ce` and `\pu` (KaTeX mhchem). Without it both are undefined control sequences, and the
# parser links no `regex`, `fancy-regex` or `thiserror`.
mhchem = ["dep:thiserror", "dep:fancy-regex", "dep:regex"]
